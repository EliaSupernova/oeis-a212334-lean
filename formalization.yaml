# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A supercongruence modulo p^5 for OEIS A212334 (observed by Peter Bala)"
  description: >-
    For OEIS A212334, given for n >= 1 by a(n) = sum over 0 <= k < n of
    C(n,k) C(n-1,k) C(n+k-1,k)^2, with a(0) = 1, a Lean 4 and Mathlib proof
    that a(p) is congruent to 1 modulo p^5 for every prime p >= 5. Peter Bala
    recorded this congruence as an observation in the OEIS entry in December
    2021. An earlier informal proof of the same congruence is public, and no
    priority is claimed. The binomial sum is taken as the definition; its
    agreement with the word-counting definition in OEIS, and the higher
    prime-power congruences conjectured in the same entry, are not formalized.
  authors:
    - "EliaSupernova"
  license: "Apache-2.0"
  responsible_maintainers:
    - "EliaSupernova"

classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11A07", "11B65", "11B83"]

sources:
  - title: "OEIS A212334, comment of 12 December 2021: a(p) == 1 (mod p^5) for primes p >= 5"
    authors:
      - "Peter Bala"
    contributors:
      - name: "Alois P. Heinz"
        role: "author of the OEIS sequence entry"
    id: "https://oeis.org/A212334"
    type: "other"
    location: "Comments section, comment dated Dec 12 2021; the binomial-sum formula is in the Formula section, dated Mar 22 2023"
    relationship: "formalizes"
    note: >-
      The source states the congruence as an observation ("It appears that")
      without proof. This repository formalizes the statement and proves it.
    license: "OEIS End-User License Agreement (https://oeis.org/LICENSE)"
    author_endorsement: "not-contacted"

  - title: "The enhanced prime congruence for A212334"
    authors:
      - "rbajaj5"
    id: "https://github.com/rbajaj5/a183068-supercongruence/blob/51d8d7d7a136baf51bd5b55337fd29c698e23232/related-results/A212334EnhancedPrimeCongruence.md"
    type: "other"
    location: "Section 1, Theorem 1; commit dated 12 August 2026"
    relationship: "other"
    note: >-
      Prior, separately authored informal proof of the same prime-level
      congruence. It reduces each summand with 0 < k < p to
      p^4/k^4 - p^3/k^3 modulo p^5 by a product formula and finishes with
      congruences for the sums of k^-3 and k^-4, treating p = 5 by direct
      computation. The Lean proof here reaches the same summand congruence by
      induction on a recurrence in k and finishes in a closely related way, by
      pairing the summands at k and p - k. No priority and no independent
      discovery of the argument is claimed.

  - title: "Some congruences for Apéry numbers"
    authors:
      - "Ira Gessel"
    id: "https://doi.org/10.1016/0022-314X(82)90071-3"
    type: "paper"
    location: "Journal of Number Theory 14 (1982), 362-368"
    relationship: "background"
    note: >-
      Context on congruences for Apéry numbers (OEIS A005259), to which the
      A212334 entry relates this sequence. Not used in the Lean proof.

  - title: "Some congruences for the Apéry numbers"
    authors:
      - "F. Beukers"
    id: "https://doi.org/10.1016/0022-314X(85)90047-2"
    type: "paper"
    location: "Journal of Number Theory 21 (1985), 141-155"
    relationship: "background"
    note: "Context on supercongruences for Apéry numbers. Not used in the Lean proof."

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/212334.lean"
    relationship: "builds-on"
    note: >-
      Google DeepMind formal-conjectures (Copyright 2026 The Formal Conjectures
      Authors, Apache-2.0). The definition OeisA212334.a and the statement
      OeisA212334.conjecture_1, with their docstrings, are copied from this file,
      where at that commit the theorem is marked open and left as sorry.

status:
  scope: >-
    Formalized: the congruence a(p) % p^5 = 1 for every prime p >= 5, with a(n)
    defined by the binomial sum. Not formalized: the equivalence of that sum with
    the OEIS word-counting and lattice-walk descriptions, the identity with
    Apéry numbers, the congruences modulo p^(3k) recorded in the entry, and the
    entry's conjecture a(p^r) == a(p^(r-1)) (mod p^(3r+3)) for r >= 2.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Fable 5.2"
        - "Gemini 4 Neon"
        - "Codex GPT-6.2 Sol"
      framework: "not recorded"
      tool_setup: >-
        AI agents directed by EliaSupernova produced the Lean proof, using
        Lean 4 and Mathlib. The division of work between the models is not
        recorded here.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: "n/a"
    - method: "agent"
      models:
        - "Claude Sonnet 5.5"
      framework: "Claude Code"
      tool_setup: >-
        Port of the proof to Lean v4.35.0-rc2 (one renamed lemma and narrower
        imports), assembly of this repository from PalomarTemplate, drafting of
        the metadata and README, and local mechanical checks.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    EliaSupernova directed AI agents, which produced the proof and this
    packaging. Correctness of the proof rests on Lean's kernel and the
    independent kernels run by lake comparator, not on the models.

fidelity:
  divergences: >-
    The Challenge defines a(n) by the binomial sum for n >= 1 and sets a(0) = 1,
    following formal-conjectures; OEIS defines the sequence by counting words and
    records the sum as a formula, and that equivalence is not formalized. The
    congruence is stated as a natural-number remainder, a p % p^5 = 1, which for
    p >= 5 is equivalent to a(p) == 1 (mod p^5). Compared with the
    formal-conjectures file, the definition and theorem statement are unchanged;
    the import, the category attributes and the module documentation differ.

review:
  status: "unchecked"
  reviewers:
    - "none"
  notes: >-
    No independent human mathematical review of the proof, the statement
    alignment or the literature account is claimed. Checks run before submission
    were mechanical: a Lean build that fails on warnings, lake comparator with the
    toolchain's bundled kernels, an axiom report, and a textual comparison of the
    definition and statement with the formal-conjectures file. No systematic
    literature search was made.

alignment:
  namespace: "OeisA212334"
  statements:
    - source: "OEIS A212334, comment by Peter Bala dated 12 December 2021"
      lean: "OeisA212334.conjecture_1"
      module: "Solution"
      status: "proved"
      note: >-
        Stated in Challenge.lean and proved in Solution.lean. The hypotheses are
        that p is prime and 5 <= p, as in the source.

acknowledgements: >-
  Peter Bala for the congruence; the OEIS; the Google DeepMind formal-conjectures
  authors for the formal statement; the Lean and Mathlib communities; and the
  Palomar template.
